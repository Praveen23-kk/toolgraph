name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: toolgraph demo
      - name: committed graph is up to date
        shell: bash
        run: |
          toolgraph ingest --fixtures
          toolgraph audit --json > audit.json
          python -c "import json; a=json.load(open('audit.json')); assert len(a['dangling'])==3, a"
